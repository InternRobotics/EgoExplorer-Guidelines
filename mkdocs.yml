site_name: EgoExplorer Guidelines
site_description: EgoExplorer capture and reconstruction guidelines (中文 / English)
site_url: https://internrobotics.github.io/EgoExplorer-Guidelines/
repo_url: https://github.com/InternRobotics/EgoExplorer-Guidelines
repo_name: InternRobotics/EgoExplorer-Guidelines
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search:
      lang: [zh, en]

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首页 Home: index.md
  - 中文:
      - 0 总览与数据流: zh/00_overview.md
      - 1 硬件组成与穿戴: zh/01_hardware_and_wearing.md
      - 2 采集主机设置: zh/02_host_setup.md
      - 3 采集脚本: zh/03_capture_scripts.md
      - 4 如何采集数据: zh/04_data_collection.md
      - 5 标定与标定数据采集: zh/05_calibration.md
      - 6 原始数据格式: zh/06_raw_data_format.md
      - 7 原始数据 → SMPL-X: zh/07_smplx_reconstruction.md
      - 8 30 Hz 统一导出: zh/08_unified_30hz.md
      - 9 质检与三联校验: zh/09_review_and_qc.md
      - 10 转换为 LeRobot v3.0: zh/10_lerobot_v3.md
      - 11 坐标系约定: zh/11_coordinate_systems.md
      - 12 运行环境与常见坑: zh/12_environment_and_pitfalls.md
  - English:
      - 0 Overview: en/00_overview.md
      - 1 Hardware and wearing: en/01_hardware_and_wearing.md
      - 2 Capture host setup: en/02_host_setup.md
      - 3 Capture scripts: en/03_capture_scripts.md
      - 4 Collecting data: en/04_data_collection.md
      - 5 Calibration: en/05_calibration.md
      - 6 Raw data format: en/06_raw_data_format.md
      - 7 Raw → SMPL-X: en/07_smplx_reconstruction.md
      - 8 Unified 30 Hz export: en/08_unified_30hz.md
      - 9 QC and review: en/09_review_and_qc.md
      - 10 LeRobot v3.0: en/10_lerobot_v3.md
      - 11 Coordinate conventions: en/11_coordinate_systems.md
      - 12 Environment and pitfalls: en/12_environment_and_pitfalls.md
